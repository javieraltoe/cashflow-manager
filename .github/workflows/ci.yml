name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cashflow
          POSTGRES_USER: cashflow
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cashflow -d cashflow"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: cashflow
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: ci_only_password
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            dashboard/requirements.txt
      - name: Instalar dependencias
        run: pip install -r backend/requirements-dev.txt -r dashboard/requirements.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Migraciones (upgrade, check, downgrade, upgrade)
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests (crea y usa la base cashflow_test)
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose (desarrollo y producción)
        run: |
          cp .env.example .env
          docker compose config --quiet
          cp .env.production.example .env
          docker compose -f docker-compose.prod.yml config --quiet
          cp .env.example .env
      - name: Validar scripts de infraestructura
        run: |
          bash -n infra/aws/bootstrap-ec2.sh infra/aws/backup-cron.sh
          shellcheck --severity=warning infra/aws/*.sh
          for f in infra/aws/*.json; do python3 -m json.tool "$f" > /dev/null; done
      - name: Build de imágenes
        run: docker compose build
